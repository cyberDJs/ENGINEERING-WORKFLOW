name: constitutional

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: constitutional-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate constitutional authority and exact content
        run: python3 scripts/validate_constitutions.py

      - name: Validate primary engineering invariant
        run: python3 scripts/validate_primary_invariant.py

      - name: Run constitutional regression tests
        run: python3 -m unittest discover -s tests -v
