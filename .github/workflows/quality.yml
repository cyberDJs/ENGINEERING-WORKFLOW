name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate controlled repository structure
        run: python3 scripts/validate_repository.py

      - name: Validate controls, profiles and open-source catalog
        run: python3 scripts/validate_control_catalog.py

      - name: Validate assurance mappings and evidence catalog
        run: python3 scripts/validate_assurance_mapping.py

      - name: Validate world-class readiness scorecard and gap register
        run: python3 scripts/validate_readiness.py

      - name: Validate locked open-source enforcement toolchain
        run: python3 scripts/validate_toolchain_lock.py

      - name: Validate supply-chain policy and immutable workflow references
        run: python3 scripts/validate_supply_chain.py

      - name: Run EW CLI self-test
        run: ./bin/ew self-test --json

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
